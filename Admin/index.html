<!doctype html>
<html lang="vi" data-astryx-theme="neutral">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>

<body>
  <div id="root">
    <style>
      body { background-color: #ffffff; margin: 0; }
      #app-nano-bar {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 2px;
        z-index: 999999;
        background: linear-gradient(90deg, #09090b, #3b82f6, #09090b);
        background-size: 200% 100%;
        animation: nano-glide 1s infinite linear;
      }
      @keyframes nano-glide {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }
    </style>
    <div id="app-nano-bar"></div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
